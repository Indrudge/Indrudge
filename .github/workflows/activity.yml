name: Recent Activity

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - name: Generate recent GitHub activity
        uses: Readme-Workflows/recent-activity@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_LINES: 8
