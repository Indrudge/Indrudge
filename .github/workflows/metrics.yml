name: Metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: IndrudgePanwar
          template: classic
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_activity: yes
