name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Indrudge
          template: classic
          base: header, repositories, activity
          plugin_languages: yes
