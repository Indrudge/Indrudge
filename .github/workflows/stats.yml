name: Local Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Indrudge
          template: classic
          base: header, repositories, activity, community
