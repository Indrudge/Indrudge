<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap');
      .name { font: bold 72px 'JetBrains Mono', monospace; fill: #00FFD5; filter: url(#neonGlow); text-transform: uppercase; letter-spacing: 8px; }
      .subtitle { font: 500 18px 'JetBrains Mono', monospace; fill: #7F00FF; letter-spacing: 5px; opacity: 0.8; }
    </style>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feGaussianBlur stdDeviation="10" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FFD5" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)">
    <animate attributeName="x" from="0" to="40" dur="10s" repeatCount="indefinite" />
  </rect>

  <g stroke="#00FFD5" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 50 50 L 20 50 L 20 20 L 50 20" />
    <path d="M 1150 50 L 1180 50 L 1180 20 L 1150 20" />
    <path d="M 50 250 L 20 250 L 20 280 L 50 280" />
    <path d="M 1150 250 L 1180 250 L 1180 280 L 1150 280" />
  </g>

  <text x="50%" y="45%" text-anchor="middle" class="name">
    INDRUDGE
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" />
  </text>

  <text x="50%" y="62%" text-anchor="middle" class="subtitle">
    [ AI SYSTEMS ] — [ LINUX ] — [ BACKEND ARCHITECT ]
  </text>

  <rect x="350" y="200" width="500" height="2" fill="#1A1A1A" rx="1" />
  <rect x="350" y="200" width="0" height="2" fill="#00FFD5" rx="1">
    <animate attributeName="width" values="0;500;0" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="350;350;850" dur="4s" repeatCount="indefinite" />
  </rect>

  <g font-family="monospace" font-size="10" fill="#00FFD5" opacity="0.4">
    <text x="60" y="260">CORE_STATUS: STABLE</text>
    <text x="60" y="275">LATENCY: 12ms</text>
    <text x="1040" y="260">LOC: 51.5074° N</text>
    <text x="1040" y="275">NET_AUTH: ENABLED</text>
  </g>
</svg>
