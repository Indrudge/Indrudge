<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300">

  <defs>
    <!-- Neon gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD5">
        <animate attributeName="stop-color"
                 values="#00FFD5;#7F00FF;#00FFD5"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7F00FF">
        <animate attributeName="stop-color"
                 values="#7F00FF;#00FFD5;#7F00FF"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow (simple, GitHub-safe) -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- HUD CORNERS -->
  <g stroke="#00FFD5" stroke-width="2" fill="none" opacity="0.6">
    <path d="M40 40 L20 40 L20 20 L40 20"/>
    <path d="M1160 40 L1180 40 L1180 20 L1160 20"/>
    <path d="M40 260 L20 260 L20 280 L40 280"/>
    <path d="M1160 260 L1180 260 L1180 280 L1160 280"/>
  </g>

  <!-- MAIN NAME -->
  <text x="600" y="145"
        text-anchor="middle"
        font-family="monospace"
        font-size="64"
        letter-spacing="8"
        fill="url(#neon)"
        filter="url(#glow)">
    INDRUDGE
    <animate attributeName="opacity"
             values="1;0.85;1"
             dur="2s"
             repeatCount="indefinite"/>
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="185"
        text-anchor="middle"
        font-family="monospace"
        font-size="18"
        letter-spacing="4"
        fill="#7F00FF"
        opacity="0.85">
    AI SYSTEMS — LINUX — BACKEND ARCHITECT
  </text>

  <!-- SCANNING LINE -->
  <line x1="350" y1="215" x2="450" y2="215"
        stroke="#00FFD5" stroke-width="2" opacity="0.9">
    <animate attributeName="x1"
             values="350;750;350"
             dur="4s"
             repeatCount="indefinite"/>
    <animate attributeName="x2"
             values="450;850;450"
             dur="4s"
             repeatCount="indefinite"/>
  </line>

  <!-- HUD TELEMETRY (LEFT) -->
  <g font-family="monospace" font-size="11" fill="#00FFD5" opacity="0.5">
    <text x="60" y="245">CORE_STATUS: STABLE</text>
    <text x="60" y="260">LATENCY: 12ms</text>
  </g>

  <!-- HUD TELEMETRY (RIGHT) -->
  <g font-family="monospace" font-size="11" fill="#00FFD5" opacity="0.5">
    <text x="960" y="245">NODE: INDRUDGE</text>
    <text x="960" y="260">NET_AUTH: ENABLED</text>
  </g>

</svg>