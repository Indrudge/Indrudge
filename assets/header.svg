<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Animated neon gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD5">
        <animate attributeName="stop-color"
                 values="#00FFD5;#7F00FF;#00FFD5"
                 dur="4s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7F00FF">
        <animate attributeName="stop-color"
                 values="#7F00FF;#00FFD5;#7F00FF"
                 dur="4s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glitch jitter -->
    <filter id="glitch">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.01"
                    numOctaves="1"
                    seed="2"
                    result="noise">
        <animate attributeName="baseFrequency"
                 values="0.01;0.02;0.01"
                 dur="2s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic"
                         in2="noise"
                         scale="2"/>
    </filter>
  </defs>

  <!-- Animated scanlines (transparent background) -->
  <g stroke="#00FFD5" stroke-width="0.4" opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60">
      <animateTransform attributeName="transform"
                        type="translate"
                        from="0 0"
                        to="0 10"
                        dur="3s"
                        repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="120" x2="1200" y2="120">
      <animateTransform attributeName="transform"
                        type="translate"
                        from="0 0"
                        to="0 15"
                        dur="4s"
                        repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="180" x2="1200" y2="180">
      <animateTransform attributeName="transform"
                        type="translate"
                        from="0 0"
                        to="0 12"
                        dur="3.5s"
                        repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Main name -->
  <text x="50%" y="50%"
        text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="56"
        fill="url(#neon)"
        filter="url(#glow) url(#glitch)">
    INDRUDGE
    <animate attributeName="opacity"
             values="1;0.88;1"
             dur="1.6s"
             repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="50%" y="65%"
        text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="20"
        fill="#8B949E">
    AI SYSTEMS • LINUX • BACKEND ARCHITECTURE
    <animate attributeName="opacity"
             values="0.85;1;0.85"
             dur="3s"
             repeatCount="indefinite"/>
  </text>
</svg>