<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Neon gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD5"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animated grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#00FFD5"
            stroke-width="0.6"
            opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Transparent background grid -->
  <rect width="100%" height="100%" fill="url(#grid)">
    <animateTransform attributeName="transform"
                      type="translate"
                      from="0 0"
                      to="40 40"
                      dur="14s"
                      repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#00FFD5" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 40 40 L 20 40 L 20 20 L 40 20"/>
    <path d="M 1160 40 L 1180 40 L 1180 20 L 1160 20"/>
    <path d="M 40 260 L 20 260 L 20 280 L 40 280"/>
    <path d="M 1160 260 L 1180 260 L 1180 280 L 1160 280"/>
  </g>

  <!-- Name -->
  <text x="50%" y="46%"
        text-anchor="middle"
        font-family="monospace"
        font-size="64"
        letter-spacing="8"
        fill="url(#neon)"
        filter="url(#glow)">
    INDRUDGE
    <animate attributeName="opacity"
             values="1;0.85;1"
             dur="2.2s"
             repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="50%" y="62%"
        text-anchor="middle"
        font-family="monospace"
        font-size="18"
        letter-spacing="5"
        fill="#7F00FF"
        opacity="0.85">
    [ AI SYSTEMS ] — [ LINUX ] — [ BACKEND ARCHITECT ]
  </text>

  <!-- Scanning progress bar -->
  <rect x="350" y="200" width="500" height="2"
        fill="#1A1A1A" rx="1"/>
  <rect x="350" y="200" width="120" height="2"
        fill="#00FFD5" rx="1">
    <animate attributeName="x"
             values="350;730;350"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <!-- HUD telemetry -->
  <g font-family="monospace" font-size="11" fill="#00FFD5" opacity="0.45">
    <text x="60" y="255">CORE_STATUS: STABLE</text>
    <text x="60" y="270">LATENCY: 12ms</text>

    <text x="980" y="255">NODE: INDRUDGE</text>
    <text x="980" y="270">NET_AUTH: ENABLED</text>
  </g>

</svg>